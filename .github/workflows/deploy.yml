name: Deploy Ticketscoopya Frontend

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: 🧹 Asegurar permisos del workspace antes del checkout
        run: |
          HOST_UID=$(id -u)
          HOST_GID=$(id -g)
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            alpine:latest \
            sh -c "chown -R ${HOST_UID}:${HOST_GID} /app"

      - name: 📥 Clonar código del repositorio
        uses: actions/checkout@v4
        with:
          clean: false

      - name: 🏗️ Compilar Frontend con Contenedor Efímero (Node 22)
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:/app" \
            -w /app \
            -e HOME=/tmp \
            -e npm_config_cache=/tmp/.npm \
            -e VITE_API_URL="/api/v1" \
            node:22-alpine \
            sh -c "npm ci && npm run build"

      - name: 🚀 Iniciar o Recargar Contenedor Caddy
        run: |
          docker compose up -d --remove-orphans
